<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | Huellas de Esperanza</title>
  <style>
    :root { --green:#1f7a5a; --dark:#123f31; --soft:#e9f5ef; --cream:#f8f7f2; --orange:#f39a52; --ink:#21332d; --muted:#68766f; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--cream); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    aside { position:fixed; inset:0 auto 0 0; width:250px; padding:28px 22px; color:#fff; background:var(--dark); }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:48px; font-size:1.08rem; font-weight:900; }
    .logo { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; background:rgba(255,255,255,.12); }
    .nav-item { display:block; margin:8px 0; padding:12px 14px; border-radius:11px; color:#cce4db; text-decoration:none; font-weight:700; }
    .nav-item.active { color:#fff; background:rgba(255,255,255,.13); }
    .logout { position:absolute; bottom:25px; left:22px; right:22px; border:1px solid rgba(255,255,255,.2); background:transparent; cursor:pointer; }
    main { margin-left:250px; padding:38px clamp(24px,5vw,70px) 70px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:32px; }
    h1 { margin:0 0 6px; font-size:clamp(1.8rem,4vw,2.7rem); letter-spacing:-.04em; }
    .subtitle { margin:0; color:var(--muted); }
    .admin-badge { flex:none; padding:10px 14px; border-radius:999px; color:var(--green); background:var(--soft); font-weight:800; }
    .layout { display:grid; grid-template-columns:minmax(350px,1fr) minmax(280px,.72fr); gap:26px; align-items:start; }
    .panel { padding:30px; border-radius:22px; background:#fff; box-shadow:0 10px 34px rgba(32,64,52,.08); }
    h2 { margin:0 0 22px; font-size:1.25rem; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:17px; }
    .field { display:flex; flex-direction:column; gap:7px; }
    .full { grid-column:1/-1; }
    label { font-size:.87rem; font-weight:800; }
    input,select,textarea { width:100%; padding:12px 13px; border:1px solid #cbd9d2; border-radius:11px; color:var(--ink); background:#fbfdfc; font:inherit; outline:none; }
    input:focus,select:focus,textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(31,122,90,.1); }
    textarea { min-height:110px; resize:vertical; }
    button { border:0; border-radius:12px; padding:13px 16px; color:#fff; background:var(--green); cursor:pointer; font:inherit; font-weight:850; }
    button:hover { background:var(--dark); }
    button:disabled { opacity:.6; cursor:wait; }
    #message { display:none; padding:12px; border-radius:10px; font-size:.9rem; font-weight:750; }
    #message.success { display:block; color:var(--dark); background:var(--soft); }
    #message.error { display:block; color:#922d2d; background:#fdeaea; }
    .preview { overflow:hidden; height:225px; margin-bottom:20px; border-radius:17px; background:var(--soft); }
    .preview img { width:100%; height:100%; object-fit:cover; }
    .preview-empty { display:grid; place-items:center; height:100%; color:var(--muted); text-align:center; }
    .pet-list { display:grid; gap:11px; max-height:390px; overflow:auto; }
    .pet-row { display:flex; align-items:center; gap:12px; padding:10px; border-radius:13px; background:#f7faf8; }
    .pet-row img { width:52px; height:52px; border-radius:11px; object-fit:cover; background:#dfe9e4; }
    .pet-row strong,.pet-row span { display:block; }
    .pet-row span { margin-top:3px; color:var(--muted); font-size:.8rem; }
    @media(max-width:900px) { aside { position:static; width:auto; padding:17px 20px; } .brand { margin:0; } aside nav,.logout { display:none; } main { margin:0; padding:28px 18px 60px; } .layout { grid-template-columns:1fr; } }
    @media(max-width:560px) { header { align-items:flex-start; } .admin-badge { display:none; } .panel { padding:22px; } .form-grid { grid-template-columns:1fr; } .full { grid-column:1; } }
  </style>
</head>
<body>
  <aside>
    <div class="brand"><span class="logo">🐾</span> Huellas Admin</div>
    <nav><a class="nav-item active" href="admin.html">＋ Registrar mascota</a><a class="nav-item" href="index.html">↗ Ver catálogo</a></nav>
    <button id="logout" class="nav-item logout" type="button">Cerrar sesión</button>
  </aside>
  <main>
    <header><div><h1>Nueva mascota</h1><p class="subtitle">Agrega un nuevo amigo al catálogo de adopción.</p></div><span id="admin-name" class="admin-badge">Administrador</span></header>
    <div class="layout">
      <section class="panel">
        <h2>Información de la mascota</h2>
        <form id="pet-form" class="form-grid">
          <div class="field"><label for="name">Nombre *</label><input id="name" name="name" required maxlength="60" placeholder="Ej. Toby"></div>
          <div class="field"><label for="species">Especie *</label><select id="species" name="species" required><option value="">Seleccionar</option><option value="Perro">Perro</option><option value="Gato">Gato</option></select></div>
          <div class="field full"><label for="approximateAge">Edad aproximada *</label><input id="approximateAge" name="approximateAge" required maxlength="40" placeholder="Ej. 2 años"></div>
          <div class="field full"><label for="imageUrl">URL de la fotografía</label><input id="imageUrl" name="imageUrl" type="url" placeholder="https://ejemplo.com/foto.jpg"></div>
          <div class="field full"><label for="description">Descripción *</label><textarea id="description" name="description" required maxlength="800" placeholder="Personalidad, historia y cuidados especiales..."></textarea></div>
          <div id="message" class="full" role="alert"></div>
          <button id="submit-btn" class="full" type="submit">Agregar al catálogo</button>
        </form>
      </section>
      <section class="panel">
        <h2>Vista previa</h2>
        <div id="preview" class="preview"><div class="preview-empty">📷<br>La fotografía aparecerá aquí</div></div>
        <h2>Mascotas publicadas (<span id="pet-count">0</span>)</h2>
        <div id="pet-list" class="pet-list"><span class="subtitle">Cargando catálogo...</span></div>
      </section>
    </div>
  </main>
  <script>
    const API_URL = 'http://localhost:4000/api';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const fallbackImage = 'https://images.unsplash.com/photo-1450778869180-41d0601e046e?w=500';
    const form = document.getElementById('pet-form');
    const imageInput = document.getElementById('imageUrl');
    const message = document.getElementById('message');

    if (!token || user?.role !== 'Admin') location.replace('login.html');
    document.getElementById('admin-name').textContent = user?.name || 'Administrador';

    function showMessage(text, type) { message.textContent = text; message.className = `full ${type}`; }
    function updatePreview() {
      const url = imageInput.value.trim();
      document.getElementById('preview').innerHTML = url ? `<img src="${url}" alt="Vista previa" onerror="this.src='${fallbackImage}'">` : '<div class="preview-empty">📷<br>La fotografía aparecerá aquí</div>';
    }

    async function loadPets() {
      try {
        const response = await fetch(`${API_URL}/pets`);
        const result = await response.json();
        document.getElementById('pet-count').textContent = result.count;
        document.getElementById('pet-list').innerHTML = result.data.map((pet) => `<div class="pet-row"><img src="${pet.imageUrl || fallbackImage}" alt=""><div><strong>${pet.name}</strong><span>${pet.species} · ${pet.approximateAge}</span></div></div>`).join('') || '<span class="subtitle">Aún no hay mascotas.</span>';
      } catch { document.getElementById('pet-list').innerHTML = '<span class="subtitle">No se pudo cargar el catálogo.</span>'; }
    }

    imageInput.addEventListener('input', updatePreview);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('submit-btn');
      button.disabled = true; button.textContent = 'Guardando...'; message.className = 'full';
      try {
        const response = await fetch(`${API_URL}/pets`, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${token}` }, body:JSON.stringify(Object.fromEntries(new FormData(form).entries())) });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'No se pudo guardar.');
        showMessage(result.message, 'success'); form.reset(); updatePreview(); await loadPets();
      } catch (error) {
        showMessage(error.message, 'error');
        if (/sesión|permisos/i.test(error.message)) setTimeout(() => location.replace('login.html'), 1200);
      } finally { button.disabled = false; button.textContent = 'Agregar al catálogo'; }
    });

    document.getElementById('logout').addEventListener('click', () => { localStorage.removeItem('token'); localStorage.removeItem('user'); location.href='login.html'; });
    loadPets();
  </script>
</body>
</html>
