<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huellas de Esperanza - Acceso</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #34495e; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #2ecc71; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:hover { background-color: #27ae60; }
    .toggle { text-align: center; margin-top: 15px; font-size: 14px; }
    .toggle a { color: #3498db; text-decoration: none; font-weight: bold; cursor: pointer; }
    #message { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="form-title">Iniciar Sesión</h2>
    
    <form id="auth-form">
      <div class="form-group" id="name-group" style="display: none;">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="******">
      </div>

      <button type="submit" id="btn-submit">Ingresar</button>
    </form>

    <div id="message"></div>

    <div class="toggle">
      <span id="toggle-text">¿No tienes cuenta?</span> 
      <a id="toggle-btn" onclick="toggleForm()">Regístrate aquí</a>
    </div>
  </div>

  <script>
    let isLogin = true;

    function toggleForm() {
      isLogin = !isLogin;
      document.getElementById('form-title').innerText = isLogin ? 'Iniciar Sesión' : 'Crear Cuenta';
      document.getElementById('name-group').style.display = isLogin ? 'none' : 'block';
      document.getElementById('btn-submit').innerText = isLogin ? 'Ingresar' : 'Registrarse';
      document.getElementById('toggle-text').innerText = isLogin ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?';
      document.getElementById('toggle-btn').innerText = isLogin ? 'Regístrate aquí' : 'Inicia sesión';
      document.getElementById('message').innerText = '';
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;
      const messageDiv = document.getElementById('message');

      const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
      const payload = isLogin ? { email, password } : { name, email, password };

      try {
        const res = await fetch(`http://localhost:4000${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
          messageDiv.style.color = 'green';
          messageDiv.innerText = isLogin ? '¡Inicio de sesión exitoso!' : '¡Usuario creado con éxito!';
          if (data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            const destination = data.user?.role === 'Admin' ? 'admin.html' : 'index.html';
            setTimeout(() => { window.location.href = destination; }, 1500);
          }
        } else {
          messageDiv.style.color = 'red';
          messageDiv.innerText = data.message || 'Ocurrió un error';
        }
      } catch (err) {
        messageDiv.style.color = 'red';
        messageDiv.innerText = 'Error al conectar con el servidor';
      }
    });
  </script>
</body>
</html>
